name: metriscan
description: Legal Metrology Label Compliance Checker — MetriScan MVP
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Camera & image picking
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # OCR
  google_mlkit_text_recognition: ^0.14.0

  # Image processing (pure Dart)
  image: ^4.2.0
  archive: ^4.0.9

  # OpenCV bindings for boundary detection & CLAHE
  opencv_dart: ^1.4.0

  # Permissions
  permission_handler: ^11.3.1

  # Local database
  sqflite: 2.4.1
  sqflite_android: 2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Unique IDs
  uuid: ^4.5.1

  # JSON
  json_annotation: ^4.9.0

  # PDF export (stub)
  pdf: ^3.11.1
  printing: ^5.13.2

  # UI
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
